name: iOS Build & Test

# This is the first real compiler in the loop for this project: it was
# built and reviewed entirely in a Linux sandbox with no Xcode available
# (see DECISIONS.md §0). This workflow runs on a macOS runner so GitHub
# Actions can give real build/test signal on every push and PR.

on:
  push:
    branches:
      - main
      - "claude/**"
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  build-and-test:
    name: Build & Test (iPhone 15 Simulator)
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "15.4"

      - name: Show Xcode & simulator versions
        run: |
          xcodebuild -version
          xcrun simctl list devices available

      - name: Build (Debug, iPhone 15 Simulator)
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme SiteVantage \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO

      - name: Test (iPhone 15 Simulator)
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme SiteVantage \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/Logs/Test/*.xcresult
          if-no-files-found: ignore
          retention-days: 14
